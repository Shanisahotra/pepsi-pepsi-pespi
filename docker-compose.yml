services:

  postgres:
    image: postgres:16
    container_name: postgres_db

    ports:
      - "5432:5432"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Jonathan123
      POSTGRES_DB: Pepsi

    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: redis_server

    ports:
      - "6379:6379"


  backend:
    build: ./Backend
    container_name: pepsi-api

    ports:
      - "5000:5000"

    depends_on:
      - postgres
      - redis

    environment:
      DATABASE_URL: postgresql://postgres:Jonathan123@postgres:5432/Pepsi?schema=public
      REDIS_URL: redis://redis:6379


  frontend:
    build: ./frontend
    container_name: react_pepsi

    ports:
      - "5173:5173"

    depends_on:
      - backend

volumes:
  postgres_data: